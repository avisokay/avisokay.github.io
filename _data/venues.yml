# Venue badge palettes, keyed by the `abbr` field of a _bibliography entry.
#
# `url` and `color` are stock al-folio. The five *_color keys are consumed by
# the patched _layouts/bib.liquid, which emits them as CSS custom properties for
# _sass/_publications.scss. Any key omitted falls back to --global-theme-color,
# so a venue absent from this file still renders as a stock badge.
#
# Light values are soft tints; dark values are the same hue at low lightness so
# the badge stays legible against the dark ground.

"AACL 2026":
  url: https://2026.aaclnet.org/
  color: "#E3F1FB"
  text_color: "#1F5F8B"
  border_color: "#BFDDF3"
  dark_color: "#1F3547"
  dark_text_color: "#BFDDF3"
  dark_border_color: "#35597A"

"NLP+CSS 2026":
